name: materia_app
description: MATERIA – Premium Artificial Leather Mobile App
publish_to: 'none'
version: 1.0.4+5

environment:
  sdk: ^3.5.0

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  provider: ^6.1.2
  google_fonts: ^6.2.1
  url_launcher: ^6.3.1
  shared_preferences: ^2.3.4
  http: ^1.2.2
  pdf: ^3.11.1
  path_provider: ^2.1.4
  share_plus: ^10.1.2
  printing: ^5.13.3
  firebase_core: ^3.6.0
  firebase_messaging: ^15.1.3
  image_picker: ^1.2.3
  open_filex: ^4.7.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/images/products/
    - assets/images/applications/
